<div class="container">
  <div class="card">
    <h1 class="title">Get your AI report for Business</h1>
    <div class="input-container">
      <textarea
        [(ngModel)]="userInput"
        class="text-input"
        placeholder="Enter your business details or requirements here..."
        rows="8"
        (keydown.enter)="onInputEntered()"
      ></textarea>
      <button class="submit-btn" (click)="onInputEntered()">
        Generate Report
      </button>
    </div>
  </div>

  <app-user-details-modal
    *ngIf="showModal"
    [userInput]="userInput"
    (close)="onModalClose()"
    (submit)="onModalSubmit($event)"
  ></app-user-details-modal>

  <!-- Success Notification at App Level - Always Visible -->
  <div class="success-overlay" *ngIf="showSuccess">
    <div class="success-content">
      <div class="success-icon">✓</div>
      <h2>Email Sent Successfully! 📧</h2>
      <p class="email-confirmation">Your business report has been sent to:</p>
      <p class="email-address"><strong>{{ successEmail }}</strong></p>
      <div class="spam-warning">
        <p class="warning-icon">⚠️</p>
        <p class="warning-text"><strong>Important:</strong> Please check your <strong>spam/junk folder</strong> if you don't see the email in your inbox. The email may take a few minutes to arrive.</p>
      </div>
      <p class="thank-you">Thank you for using our service! 🙏</p>
    </div>
  </div>
</div>
